<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect | Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">CampusConnect</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="register.html" class="active">Register</a></li>
            </ul>
        </nav>
    </header>

    <main class="register-container">
        <div class="form-card">
            <h2>Create Account</h2>
            <p>Join the TVET Portal to stay updated.</p>
            
            <form>
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Student ID / Admission No.</label>
                    <input type="text" placeholder="e.g. 12345" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password" required>
                </div>

                <button type="submit" class="register-btn">Register Now</button>
            </form>
            <p class="form-footer">Already have an account? <a href="#">Login here</a></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 CampusConnect TVET Portal. All Rights Reserved.</p>
    </footer>

</body>
</html>
