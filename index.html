<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect | Events</title>
    <!-- Linking to your CSS file in the css folder -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">CampusConnect</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html" class="active">Events</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="gallery-section">
            <h1 class="section-title">UPCOMING EVENTS</h1>
            
            <div class="events-grid">
                <!-- Card 1: Cultural Week -->
                <div class="event-card">
                    <div class="img-container">
                        <img src="images/cultural.jpg" alt="Cultural Week">
                    </div>
                    <div class="card-content">
                        <h3>Cultural Week</h3>
                        <p>March 15 - 20, 2026</p>
                        <button class="btn">Show Details</button>
                    </div>
                </div>

                <!-- Card 2: Students -->
                <div class="event-card">
                    <div class="img-container">
                        <img src="images/students.jpg" alt="Sports Day">
                    </div>
                    <div class="card-content">
                        <h3>Sports Day</h3>
                        <p>April 5, 2026</p>
                        <button class="btn">Show Details</button>
                    </div>
                </div>

                <!-- Card 3: School Building -->
                <div class="event-card">
                    <div class="img-container">
                        <img src="images/building.jpg" alt="Campus Building">
                    </div>
                    <div class="card-content">
                        <h3>Orientation</h3>
                        <p>May 12, 2026</p>
                        <button class="btn">Show Details</button>
                    </div>
                </div>

                <!-- Card 4: Tree Planting -->
                <div class="event-card">
                    <div class="img-container">
                        <img src="images/tree-planting.jpg" alt="Tree Planting">
                    </div>
                    <div class="card-content">
                        <h3>Tree Planting</h3>
                        <p>June 20, 2026</p>
                        <button class="btn">Show Details</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CampusConnect TVET Portal. All Rights Reserved.</p>
    </footer>

</body>
</html>
